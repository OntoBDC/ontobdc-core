statechart:
  name: StandardSystemUpdate
  description: "Statechart for updating a system: the ddock, its packages and its node application."

  root state:
    name: standard_system_update
    initial: undefined

    states:
      - name: undefined
        label:
          en: "Undefined"
          pt-br: "Indefinido"
        description:
          en: "Initial state before the update has a valid system.obdc."
          pt-br: "Estado inicial antes de a atualização ter um system.obdc válido."
        transitions:
          - target: system_descriptor_valid
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.SYSTEM_DESCRIPTOR_VALID)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.SYSTEM_DESCRIPTOR_VALID)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.UNDEFINED, to_state = SystemUpdateProcessStatePort.SYSTEM_DESCRIPTOR_VALID)

      - name: system_descriptor_valid
        label:
          en: "System Descriptor Valid"
          pt-br: "Descritor do Sistema Válido"
        description:
          en: "The container has a system.obdc and it is valid."
          pt-br: "O container tem um system.obdc e ele é válido."
        transitions:
          - target: ddock_source_refreshed
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.DDOCK_SOURCE_REFRESHED)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.DDOCK_SOURCE_REFRESHED)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.SYSTEM_DESCRIPTOR_VALID, to_state = SystemUpdateProcessStatePort.DDOCK_SOURCE_REFRESHED)

      - name: ddock_source_refreshed
        label:
          en: "DDock Source Refreshed"
          pt-br: "Fonte do DDock Atualizada"
        description:
          en: "The source folder of the container was replaced by the ddock of the repository system.obdc names."
          pt-br: "A pasta source do container foi substituída pelo ddock do repositório que o system.obdc nomeia."
        transitions:
          - target: packages_refreshed
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.PACKAGES_REFRESHED)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.PACKAGES_REFRESHED)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.DDOCK_SOURCE_REFRESHED, to_state = SystemUpdateProcessStatePort.PACKAGES_REFRESHED)

      - name: packages_refreshed
        label:
          en: "Packages Refreshed"
          pt-br: "Pacotes Atualizados"
        description:
          en: "The host of each package of system.obdc was fetched again and put into the source folder of the container."
          pt-br: "O host de cada pacote do system.obdc foi baixado de novo e posto na pasta source do container."
        transitions:
          - target: addons_refreshed
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.ADDONS_REFRESHED)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.ADDONS_REFRESHED)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.PACKAGES_REFRESHED, to_state = SystemUpdateProcessStatePort.ADDONS_REFRESHED)

      - name: addons_refreshed
        label:
          en: "Addons Refreshed"
          pt-br: "Addons Atualizados"
        description:
          en: "The folder each package of system.obdc names was fetched again, and the one that holds an addon was copied into the addon folder of the container."
          pt-br: "A pasta que cada pacote do system.obdc nomeia foi baixada de novo, e a que tem um addon foi copiada para a pasta addon do container."
        transitions:
          - target: config_overridden
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.CONFIG_OVERRIDDEN)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.CONFIG_OVERRIDDEN)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.ADDONS_REFRESHED, to_state = SystemUpdateProcessStatePort.CONFIG_OVERRIDDEN)

      - name: config_overridden
        label:
          en: "Config Overridden"
          pt-br: "Configuração Sobrescrita"
        description:
          en: "The override of system.obdc, when it has one, was copied to the override of asset/config.yaml of the source folder of the container."
          pt-br: "O override do system.obdc, quando ele tem um, foi copiado para o override do asset/config.yaml da pasta source do container."
        transitions:
          - target: config_server_copied
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.CONFIG_SERVER_COPIED)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.CONFIG_SERVER_COPIED)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.CONFIG_OVERRIDDEN, to_state = SystemUpdateProcessStatePort.CONFIG_SERVER_COPIED)

      - name: config_server_copied
        label:
          en: "Config Server Copied"
          pt-br: "Server da Configuração Copiado"
        description:
          en: "The server of system.obdc, when it has one, was copied to the server of asset/config.yaml of the source folder of the container, replacing all of it."
          pt-br: "O server do system.obdc, quando ele tem um, foi copiado para o server do asset/config.yaml da pasta source do container, substituindo tudo."
        transitions:
          - target: python_manifest_updated
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.PYTHON_MANIFEST_UPDATED)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.PYTHON_MANIFEST_UPDATED)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.CONFIG_SERVER_COPIED, to_state = SystemUpdateProcessStatePort.PYTHON_MANIFEST_UPDATED)

      - name: python_manifest_updated
        label:
          en: "Python Manifest Updated"
          pt-br: "Manifest Python Atualizado"
        description:
          en: "The Python dependencies of system.obdc are in the wheels of python/manifest.json of the source folder of the container, with their versions."
          pt-br: "As dependências Python do system.obdc estão nos wheels do python/manifest.json da pasta source do container, com as suas versões."
        transitions:
          - target: system_lock_written
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.SYSTEM_LOCK_WRITTEN)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.SYSTEM_LOCK_WRITTEN)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.PYTHON_MANIFEST_UPDATED, to_state = SystemUpdateProcessStatePort.SYSTEM_LOCK_WRITTEN)

      - name: system_lock_written
        label:
          en: "System Lock Written"
          pt-br: "Lock do Sistema Gravado"
        description:
          en: "The system.obdc.lock says what was installed."
          pt-br: "O system.obdc.lock diz o que foi instalado."
        transitions:
          - target: node_built
            guard: handler.can_transit_to(to_state = SystemUpdateProcessStatePort.NODE_BUILT)
            action: handler.perform_state_transition(to_state = SystemUpdateProcessStatePort.NODE_BUILT)
            contract:
              - after: handler.validate_state_transition(from_state = SystemUpdateProcessStatePort.SYSTEM_LOCK_WRITTEN, to_state = SystemUpdateProcessStatePort.NODE_BUILT)

      - name: node_built
        label:
          en: "Node Built"
          pt-br: "Node Compilado"
        description:
          en: "The node application was compiled with npm run build."
          pt-br: "A aplicação node foi compilada com npm run build."
        type: final
