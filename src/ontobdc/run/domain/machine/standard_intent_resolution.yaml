statechart:
  name: StandardIntentResolution
  description: "Statechart for OntoBDC run prompt intent resolution. Only the first eight states of the eventual pipeline are wired so far."

  root state:
    name: standard_intent_resolution
    initial: undefined

    states:
      - name: undefined
        description: "Initial state before intent resolution begins."
        transitions:
          - target: received
            guard: handler.can_transit_to(to_state = IntentResolutionStatePort.RECEIVED)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.RECEIVED)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.UNDEFINED, to_state = IntentResolutionStatePort.RECEIVED)

      - name: received
        description: "The prompt has been received."
        transitions:
          - target: language_defined
            guard: handler.can_transit_to(to_state = IntentResolutionStatePort.LANGUAGE_DEFINED)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.LANGUAGE_DEFINED)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.RECEIVED, to_state = IntentResolutionStatePort.LANGUAGE_DEFINED)

      - name: language_defined
        description: "The run's language is confirmed to be one a3 recognizes."
        transitions:
          - target: canonical
            guard: handler.can_transit_to(to_state = IntentResolutionStatePort.CANONICAL)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.CANONICAL)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.LANGUAGE_DEFINED, to_state = IntentResolutionStatePort.CANONICAL)

      - name: canonical
        description: "The prompt has been normalized to a stable canonical form."
        transitions:
          - target: parsed
            guard: handler.can_transit_to(to_state = IntentResolutionStatePort.PARSED)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.PARSED)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.CANONICAL, to_state = IntentResolutionStatePort.PARSED)

      - name: parsed
        description: "The canonical intent has been parsed and scored."
        # These two guards are exhaustive and mutually exclusive (sufficient
        # XOR insufficient), so exactly one always fires once "parsed"'s own
        # capability has run and cached a score -- unlike a state with only
        # one *conditional* transition, this never risks StateWorkerAdapter's
        # stuck-state detection (which fires when an execute_once() call
        # changes nothing).
        transitions:
          - target: matched
            guard: handler.intent_score_is_sufficient() and handler.can_transit_to(to_state = IntentResolutionStatePort.MATCHED)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.MATCHED)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.PARSED, to_state = IntentResolutionStatePort.MATCHED)
          - target: low_confidence
            guard: handler.intent_score_is_insufficient() and handler.can_transit_to(to_state = IntentResolutionStatePort.LOW_CONFIDENCE)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.LOW_CONFIDENCE)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.PARSED, to_state = IntentResolutionStatePort.LOW_CONFIDENCE)

      - name: low_confidence
        description: "The parsed score was insufficient; capability tag matching was attempted from the parsed intent's noun root."
        transitions:
          - target: validated
            guard: handler.intent_score_is_sufficient() and handler.can_transit_to(to_state = IntentResolutionStatePort.VALIDATED)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.VALIDATED)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.LOW_CONFIDENCE, to_state = IntentResolutionStatePort.VALIDATED)

      - name: matched
        description: "The parsed score was sufficient; candidate capabilities were matched by tag directly from the parsed intent's noun root."
        transitions:
          - target: validated
            guard: handler.intent_score_is_sufficient() and handler.can_transit_to(to_state = IntentResolutionStatePort.VALIDATED)
            action: handler.perform_state_transition(to_state = IntentResolutionStatePort.VALIDATED)
            contract:
              - after: handler.validate_state_transition(from_state = IntentResolutionStatePort.MATCHED, to_state = IntentResolutionStatePort.VALIDATED)

      - name: validated
        description: "The user confirmed which matched capability they meant; intent resolution stops here for now."
        # Not marked `type: final` on purpose -- same reasoning as every
        # other truncation point in this chart: a `final` leaf would be
        # entered and exited within the same sismic macrostep, emptying
        # the interpreter's configuration before StateWorkerAdapter ever
        # samples it as active. Callers stop the walk explicitly at this
        # state instead (`worker.work(stop_state=
        # IntentResolutionState.VALIDATED)`); see
        # IntentResolutionStateTransitionHandler.execute().
