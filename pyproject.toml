[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontobdc"
authors = [
    { name = "Elias Magalhães", email = "elias@brasidata.com" }
]
version = "0.22.0"
description = "OntoBDC (Ontology-Based Datasets & Containers)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "pydantic",
    "PyYAML",
    "rfc3987",
    "rdflib",
    "requests",
    "frictionless",
    "sismic",
    "pyfiglet",
    "pyshacl",
    "textual",
    "Jinja2",
    
]

[project.optional-dependencies]
a3 = [
    "ontobdc-a3",
]
dev = [
    "ontobdc-dev",
]
draw = [
    "vtracer",
]

[project.scripts]
ontobdc = "ontobdc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"ontobdc" = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.jinja",
    "check/*.json",
    "core/**",
    "module/**",
    "prompt/**",
    "view/asset/**",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontobdc*"]

[tool.ontobdc]
documentation_scope = "current CLI command surface"
documentation_source = "https://ontobdc.org/"
