[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontobdc"
authors = [
    { name = "Elias Magalhães", email = "elias@brasidata.com" }
]
version = "0.18.0"
description = "OntoBDC (Ontology-Based Datasets & Containers)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "ontobdc-view>=0.4.0",
    "brasidatacenter @ git+https://github.com/Brasidata/brasidatacenter.git@master",
    "hatchling>=1.26",
    "setuptools",
    "requests",
    "rdflib",
    "pydantic",
    "PyYAML",
    "Jinja2",
    "sismic",
    "rocrate",
    "rich",
    "netext>=0.5.0",
    "pyfiglet",
    "pymupdf4llm",
    "langid",
    "openpyxl",
    "frictionless",
    "rfc3987",
    "spacy",
    "spacy-lookups-data",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
]

[project.scripts]
ontobdc = "ontobdc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"ontobdc" = [
    "**/*.yaml",
    "**/*.yml",
    "check/*.json",
    "core/**",
    "module/**",
    "prompt/**",
    "view/asset/**",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontobdc*"]

[tool.ontobdc]
documentation_scope = "current CLI command surface"
documentation_source = "https://ontobdc.org/"
